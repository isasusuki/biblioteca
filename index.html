    function formatISO(date) {
      const d = new Date(date);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const dia = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${dia}`;
    }

    function addDays(dateStr, days) {
      const parts = dateStr.split('-').map(Number);
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      d.setDate(d.getDate() + days);
      return formatISO(d);
    }

    function formatDateBR(dateStr) {
      if (!dateStr) return '-';
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    function calcDaysDiff(dateLimitStr) {
      const now = new Date();
      now.setHours(0, 0, 0, 0);
      const parts = dateLimitStr.split('-').map(Number);
      const limit = new Date(parts[0], parts[1] - 1, parts[2]);
      limit.setHours(0, 0, 0, 0);
      const diffTime = limit.getTime() - now.getTime();
      return Math.round(diffTime / (1000 * 3600 * 24));
    }

    function loadState() {
      const rawLivros = localStorage.getItem(STORAGE_KEYS.LIVROS);
      const rawLeitores = localStorage.getItem(STORAGE_KEYS.LEITORES);
      const rawEmprestimos = localStorage.getItem(STORAGE_KEYS.EMPRESTIMOS);
      const rawAvaliacoes = localStorage.getItem(STORAGE_KEYS.AVALIACOES);
      const rawSession = localStorage.getItem(STORAGE_KEYS.SESSION);

      if (rawLivros && rawLeitores && rawEmprestimos) {
        try {
          state.livros = JSON.parse(rawLivros);
          state.leitores = JSON.parse(rawLeitores);
          state.emprestimos = JSON.parse(rawEmprestimos);
          state.avaliacoes = rawAvaliacoes ? JSON.parse(rawAvaliacoes) : [];
        } catch (e) {
          resetMockData(false);
        }
      } else {
        resetMockData(false);
      }

      if (rawSession) {
        try {
          state.session = JSON.parse(rawSession);
        } catch (e) {
          state.session = null;
        }
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEYS.LIVROS, JSON.stringify(state.livros));
      localStorage.setItem(STORAGE_KEYS.LEITORES, JSON.stringify(state.leitores));
      localStorage.setItem(STORAGE_KEYS.EMPRESTIMOS, JSON.stringify(state.emprestimos));
      localStorage.setItem(STORAGE_KEYS.AVALIACOES, JSON.stringify(state.avaliacoes));
      if (state.session) {
        localStorage.setItem(STORAGE_KEYS.SESSION, JSON.stringify(state.session));
      } else {
        localStorage.removeItem(STORAGE_KEYS.SESSION);
      }
    }

    function resetMockData(showToastMsg = true) {
      const mock = getMockData();
      state.livros = mock.livros;
      state.leitores = mock.leitores;
      state.emprestimos = mock.emprestimos;
      state.avaliacoes = mock.avaliacoes;
      saveState();
      renderApp();
      if (showToastMsg) {
        toast('Dados Restaurados', 'Base padrão recarregada com sucesso (5 livros, 3 leitores, 4 empréstimos).', 'success');
      }
    }

    // =========================================================================
    // 3. TOASTS & FEEDBACK
    // =========================================================================
    function toast(title, message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const toastEl = document.createElement('div');
      toastEl.className = `pointer-events-auto flex items-start gap-3 p-3.5 rounded-xl shadow-xl border text-xs transition-all duration-300 transform translate-x-4 opacity-0 ${
        type === 'success' ? 'bg-emerald-50 border-emerald-200 text-emerald-900' :
        type === 'danger' ? 'bg-rose-50 border-rose-200 text-rose-900' :
        type === 'warning' ? 'bg-amber-50 border-amber-200 text-amber-900' :
        'bg-slate-900 border-slate-800 text-white'
      }`;

      toastEl.innerHTML = `
        <div class="flex-1">
          <strong class="font-bold block">${title}</strong>
          <span class="opacity-90 block mt-0.5">${message}</span>
        </div>
      `;

      container.appendChild(toastEl);

      // Animate in
      setTimeout(() => {
        toastEl.classList.remove('translate-x-4', 'opacity-0');
      }, 10);

      // Auto dismiss
      setTimeout(() => {
        toastEl.classList.add('translate-x-4', 'opacity-0');
        setTimeout(() => toastEl.remove(), 300);
      }, 4200);
    }

    function escapeHtml(str) {
      if (typeof str !== 'string') return str == null ? '' : String(str);
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

        container.innerHTML = renderLibrarianAppHtml();

        return;

        const leitor = state.leitores.find(l => l.id === state.session.leitorId) || state.leitores[0];

        attachReaderPortalEvents(leitor);

      setBarrierTab(tab) {

      quickFillLibrarian() {
        barrierTab = 'librarian';
        renderApp();
        setTimeout(() => {
          const u = document.getElementById('lib-user');
          const p = document.getElementById('lib-pass');
          if (u) u.value = 'bibliotecario';
          if (p) p.value = 'biblio123';
        }, 20);

      quickFillReader(matricula, pass) {
        barrierTab = 'reader';
        renderApp();
        setTimeout(() => {
          const id = document.getElementById('reader-id');
          const p = document.getElementById('reader-pass');
          if (id) id.value = matricula;
          if (p) p.value = pass;
        }, 20);
      },

      submitLibrarianLogin(e) {
        if (e) e.preventDefault();
        const u = (document.getElementById('lib-user')?.value || '').trim().toLowerCase();
        const p = (document.getElementById('lib-pass')?.value || '').trim();

        if ((u === 'bibliotecario' || u === 'admin') && (p === 'biblio123' || p === 'admin123')) {
          state.session = { role: 'librarian', loginMethod: 'senha', timestamp: new Date().toISOString() };
          saveState();
          renderApp();
          toast('Acesso Autorizado', 'Bem-vindo ao Terminal do Bibliotecário.', 'success');
        } else {
          const err = document.getElementById('lib-error');
          if (err) {
            err.textContent = 'Usuário ou senha incorretos. Utilize as dicas de teste: bibliotecario / biblio123.';
            err.classList.remove('hidden');
          }
        }
      },

      submitReaderLogin(e) {
        if (e) e.preventDefault();
        const term = (document.getElementById('reader-id')?.value || '').trim().toLowerCase();
        const pass = (document.getElementById('reader-pass')?.value || '').trim();

        const leitor = state.leitores.find(l =>
          l.matricula.toLowerCase() === term ||
          l.email.toLowerCase() === term ||
          l.cpf.replace(/\D/g, '') === term.replace(/\D/g, '') ||
          l.nome.toLowerCase().includes(term)
        );

        if (!leitor) {
          const err = document.getElementById('reader-error');
          if (err) {
            err.textContent = 'Matrícula ou leitor não localizado. Cadastre-se na aba ao lado ou clique nas dicas.';
            err.classList.remove('hidden');
          }
          return;
        }

        if (leitor.senha && pass && leitor.senha !== pass) {
          const err = document.getElementById('reader-error');
          if (err) {
            err.textContent = `Senha incorreta para ${leitor.nome}. Senha cadastrada: "${leitor.senha}".`;
            err.classList.remove('hidden');
          }
          return;
        }

        state.session = { role: 'reader', leitorId: leitor.id, leitorNome: leitor.nome, matricula: leitor.matricula };
        saveState();
        renderApp();
        toast('Consulta Liberada', `Bem-vindo(a), ${leitor.nome}!`, 'success');
      },

      submitRegisterReader(e) {
        if (e) e.preventDefault();
        const nome = (document.getElementById('reg-nome')?.value || '').trim();
        const categoria = document.getElementById('reg-categoria')?.value || 'Aluno';
        const cpf = (document.getElementById('reg-cpf')?.value || '').trim();
        const email = (document.getElementById('reg-email')?.value || '').trim();
        const telefone = (document.getElementById('reg-telefone')?.value || '').trim();
        const senha = (document.getElementById('reg-senha')?.value || '').trim() || 'aluno123';

        if (!nome || !cpf || !email) return;

        const ano = new Date().getFullYear();
        const prefix = categoria === 'Professor' ? 'DOC' : (categoria === 'Funcionário' ? 'FUNC' : 'MAT');
        const seq = String(state.leitores.length + 1).padStart(4, '0');
        const matricula = `${ano}-${prefix}-${seq}`;

        const novoLeitor = {
          id: `leitor-${Date.now()}`,
          nome,
          matricula,
          cpf,
          categoria,
          email,
          telefone: telefone || '(11) 98000-0000',
          senha,
          dataCadastro: formatISO(new Date()),
          status: 'Ativo'
        };

        state.leitores.unshift(novoLeitor);
        saveState();

        toast('Cadastro Concluído!', `Sua matrícula gerada é ${matricula}.`, 'success');

        // Exibir modal de compartilhamento de credenciais
        AppActions.openShareModal(novoLeitor);
      },

      logout() {
        state.session = null;
        state.currentTab = 'dashboard';
        state.readerTab = 'loans';
        saveState();
        renderApp();
        toast('Terminal Bloqueado', 'Sessão encerrada com segurança.', 'info');

        renderApp();

      setReaderTab(tab) {
        state.readerTab = tab;
        renderApp();
      },

        const tbody = document.getElementById('acervo-tbody');

        const term = (document.getElementById('acervo-search')?.value || '').toLowerCase();

        const filtered = state.livros.filter(l =>
          !term ||
          l.titulo.toLowerCase().includes(term) ||
          l.autor.toLowerCase().includes(term) ||
          l.cdd.toLowerCase().includes(term)
        );

        tbody.innerHTML = filtered.map(l => {
          const disp = l.qtdDisponivel > 0;
          return `
            <tr class="hover:bg-slate-50">
              <td class="py-3 px-3 font-mono">
                <span class="font-bold text-slate-900 bg-slate-100 px-2 py-0.5 rounded border border-slate-200">${escapeHtml(l.cdd)}</span>
                <div class="text-[10px] text-slate-400 mt-0.5">${escapeHtml(l.isbn || '')}</div>
              </td>
              <td class="py-3 px-3">
                <strong class="text-slate-900 block font-semibold text-xs">${escapeHtml(l.titulo)}</strong>
                <span class="text-[11px] text-slate-600">${escapeHtml(l.autor)}</span>
              </td>
              <td class="py-3 px-3 text-slate-600">
                <div>${escapeHtml(l.editora)}</div>

      adjustStock(livroId, delta) {
        const livro = state.livros.find(l => l.id === livroId);
        if (!livro) return;
        if (delta < 0 && livro.qtdDisponivel <= 0) return;
        livro.qtdDisponivel += delta;
        if (delta > 0 && livro.qtdDisponivel > livro.qtdTotal) {
          livro.qtdTotal = livro.qtdDisponivel;
        }
        saveState();
        AppActions.renderAcervoRows();
        toast('Estoque Atualizado', `Exemplares de "${livro.titulo}": ${livro.qtdDisponivel} disponíveis.`, 'info');
      },

      submitSalvarLivro(e) {
        if (e) e.preventDefault();
        const titulo = (document.getElementById('livro-titulo')?.value || '').trim();
        const autor = (document.getElementById('livro-autor')?.value || '').trim();
        const editora = (document.getElementById('livro-editora')?.value || '').trim() || 'Editora Geral';
        const ano = Number(document.getElementById('livro-ano')?.value) || 2024;
        const cdd = (document.getElementById('livro-cdd')?.value || '').trim();
        const isbn = (document.getElementById('livro-isbn')?.value || '').trim();
        const edicao = (document.getElementById('livro-edicao')?.value || '').trim() || '1ª ed.';
        const localizacao = (document.getElementById('livro-localizacao')?.value || '').trim() || 'Estante Central';
        const qtdTotal = Number(document.getElementById('livro-qtd-total')?.value) || 1;
        const qtdDisp = Number(document.getElementById('livro-qtd-disp')?.value) || 1;

        if (librarianEditingLivroId) {
          const l = state.livros.find(item => item.id === librarianEditingLivroId);
          if (l) {
            Object.assign(l, { titulo, autor, editora, ano, cdd, isbn, edicao, localizacao, qtdTotal, qtdDisponivel: qtdDisp });
          }
          librarianEditingLivroId = null;
          toast('Ficha Atualizada', `"${titulo}" foi salvo no acervo.`, 'success');
        } else {
          state.livros.unshift({
            id: `livro-${Date.now()}`,
            titulo, autor, editora, ano, cdd, isbn, edicao, localizacao, qtdTotal, qtdDisponivel: qtdDisp
          });
          toast('Livro Digitalizado', `Ficha de "${titulo}" adicionada com sucesso.`, 'success');
        }

        saveState();
        renderApp();
      },

      prepararEditLivro(livroId) {
        const l = state.livros.find(item => item.id === livroId);
        if (!l) return;
        librarianEditingLivroId = l.id;
        renderApp();
        setTimeout(() => {
          document.getElementById('livro-titulo').value = l.titulo;
          document.getElementById('livro-autor').value = l.autor;
          document.getElementById('livro-editora').value = l.editora;
          document.getElementById('livro-ano').value = l.ano;
          document.getElementById('livro-cdd').value = l.cdd;
          document.getElementById('livro-isbn').value = l.isbn || '';
          document.getElementById('livro-edicao').value = l.edicao || '';
          document.getElementById('livro-localizacao').value = l.localizacao;
          document.getElementById('livro-qtd-total').value = l.qtdTotal;
          document.getElementById('livro-qtd-disp').value = l.qtdDisponivel;
        }, 30);

      cancelEditLivro() {
        librarianEditingLivroId = null;
        renderApp();
      },

      deleteLivro(livroId, titulo) {
        const hasLoans = state.emprestimos.some(e => e.livroId === livroId && e.status === 'Ativo');
        if (hasLoans) {
          toast('Exclusão Bloqueada', `Não é possível excluir "${titulo}" pois existem empréstimos ativos com leitores.`, 'danger');
          return;
        }
        state.livros = state.livros.filter(l => l.id !== livroId);
        saveState();
        AppActions.renderAcervoRows();
        toast('Livro Removido', `O livro "${titulo}" foi removido do acervo.`, 'info');

      // EMPRÉSTIMOS FUNCTIONS
      onEmpDataRetiradaChange(newDate) {
        const prevInp = document.getElementById('emp-data-prevista');
        if (prevInp && newDate) {
          prevInp.value = addDays(newDate, 14);
        }
      },

      submitNovoEmprestimo(e) {
        if (e) e.preventDefault();
        const leitorId = document.getElementById('emp-leitor')?.value;
        const livroId = document.getElementById('emp-livro')?.value;
        const dataRetirada = document.getElementById('emp-data-retirada')?.value;
        const dataPrevista = document.getElementById('emp-data-prevista')?.value;
        const obs = (document.getElementById('emp-obs')?.value || '').trim();

        if (!leitorId || !livroId) {
          toast('Atenção', 'Selecione leitor e livro.', 'danger');
          return;
        }

        const livro = state.livros.find(l => l.id === livroId);
        if (!livro || livro.qtdDisponivel <= 0) {
          toast('Estoque Esgotado', 'Todos os exemplares físicos deste livro já estão emprestados.', 'danger');
          return;
        }

        // Subtrai 1 exemplar
        livro.qtdDisponivel -= 1;

        const ano = new Date().getFullYear();
        const seq = String(state.emprestimos.length + 1).padStart(4, '0');
        const numeroFicha = `FCH-${ano}-${seq}`;

        state.emprestimos.unshift({
          id: `emp-${Date.now()}`,
          numeroFicha,
          livroId,
          leitorId,
          dataEmprestimo: dataRetirada,
          dataDevolucaoPrevista: dataPrevista,
          dataDevolucaoEfetiva: null,
          status: 'Ativo',
          observacoes: obs || 'Empréstimo concedido no balcão central.'
        });

        saveState();
        renderApp();
        toast('Empréstimo Concluído!', `Ficha ${numeroFicha} emitida com sucesso.`, 'success');
      },

      renderEmprestimosRows() {
        const tbody = document.getElementById('emp-tbody');
        if (!tbody) return;
        const term = (document.getElementById('emp-search')?.value || '').toLowerCase();
        const statusFilter = document.getElementById('emp-filter-status')?.value || 'ativos';

        const filtered = state.emprestimos.filter(emp => {
          const livro = state.livros.find(l => l.id === emp.livroId);
          const leitor = state.leitores.find(r => r.id === emp.leitorId);

          const match = !term ||
            emp.numeroFicha.toLowerCase().includes(term) ||
            (livro && livro.titulo.toLowerCase().includes(term)) ||
            (leitor && leitor.nome.toLowerCase().includes(term)) ||
            (leitor && leitor.matricula.toLowerCase().includes(term));

          if (!match) return false;

          const diff = calcDaysDiff(emp.dataDevolucaoPrevista);
          if (statusFilter === 'ativos') return emp.status === 'Ativo';
          if (statusFilter === 'atrasados') return emp.status === 'Ativo' && diff < 0;
          if (statusFilter === 'hoje') return emp.status === 'Ativo' && diff === 0;
          if (statusFilter === 'devolvidos') return emp.status === 'Devolvido';
          return true;
        });

        tbody.innerHTML = filtered.map(emp => {
          const livro = state.livros.find(l => l.id === emp.livroId);
          const leitor = state.leitores.find(r => r.id === emp.leitorId);
          const diff = calcDaysDiff(emp.dataDevolucaoPrevista);
          const isOverdue = emp.status === 'Ativo' && diff < 0;

          return `
            <tr class="hover:bg-slate-50">
              <td class="py-3 px-3 font-mono font-bold text-blue-700">${emp.numeroFicha}</td>
              <td class="py-3 px-3">
                <strong class="text-slate-900 block font-semibold text-xs">${escapeHtml(livro?.titulo || 'Livro')}</strong>
                <span class="text-[11px] text-slate-500">${escapeHtml(livro?.localizacao || '')}</span>
              </td>
              <td class="py-3 px-3">
                <strong class="text-slate-800 block">${escapeHtml(leitor?.nome || 'Leitor')}</strong>
                <span class="text-[10px] text-slate-400 font-mono">${escapeHtml(leitor?.matricula || '')}</span>
              </td>
              <td class="py-3 px-3 font-mono text-slate-600">${formatDateBR(emp.dataEmprestimo)}</td>
              <td class="py-3 px-3 font-mono">
                <span class="${isOverdue ? 'text-rose-600 font-bold' : 'text-slate-900 font-semibold'}">${formatDateBR(emp.dataDevolucaoPrevista)}</span>
              </td>
              <td class="py-3 px-3">
                ${emp.status === 'Devolvido' ? `
                  <span class="text-[11px] font-semibold text-slate-600 bg-slate-100 px-2 py-0.5 rounded">Devolvido (${formatDateBR(emp.dataDevolucaoEfetiva)})</span>
                ` : isOverdue ? `
                  <span class="text-[11px] font-bold text-rose-700 bg-rose-50 px-2 py-0.5 rounded border border-rose-200">Atrasado (${Math.abs(diff)}d)</span>
                ` : `
                  <span class="text-[11px] font-semibold text-blue-700 bg-blue-50 px-2 py-0.5 rounded border border-blue-200">${diff} dias restantes</span>
                `}
              </td>
              <td class="py-3 px-3 text-right space-x-1 whitespace-nowrap">
                ${emp.status === 'Ativo' ? `
                  <button type="button" onclick="AppActions.devolverEmprestimo('${emp.id}')" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-xs font-semibold">Devolver</button>
                  <button type="button" onclick="AppActions.renovarEmprestimo('${emp.id}')" class="px-2 py-1 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded text-xs">+7d</button>
                ` : '<span class="text-slate-400 text-[11px]">Finalizado</span>'}
              </td>
            </tr>
          `;
        }).join('');
      },

      devolverEmprestimo(empId) {
        const emp = state.emprestimos.find(e => e.id === empId);
        if (!emp || emp.status === 'Devolvido') return;

        emp.status = 'Devolvido';
        emp.dataDevolucaoEfetiva = formatISO(new Date());

        const livro = state.livros.find(l => l.id === emp.livroId);
        if (livro) {
          livro.qtdDisponivel = Math.min(livro.qtdTotal, livro.qtdDisponivel + 1);
        }

        saveState();
        renderApp();
        toast('Devolução Concluída!', `Exemplar devolvido ao acervo (+1 disponível).`, 'success');
      },

      renovarEmprestimo(empId) {
        const emp = state.emprestimos.find(e => e.id === empId);
        if (!emp || emp.status === 'Devolvido') return;

        const diff = calcDaysDiff(emp.dataDevolucaoPrevista);
        const base = diff < 0 ? formatISO(new Date()) : emp.dataDevolucaoPrevista;
        emp.dataDevolucaoPrevista = addDays(base, 7);

        saveState();
        renderApp();
        toast('Prazo Renovado (+7 Dias)', `Nova data limite: ${formatDateBR(emp.dataDevolucaoPrevista)}.`, 'success');
      },

      confirmPickup(e, livroId) {
        if (e) e.preventDefault();
        const livro = state.livros.find(l => l.id === livroId);
        if (!livro || livro.qtdDisponivel <= 0 || !state.session?.leitorId) return;

        const dataPegar = document.getElementById('pickup-date')?.value || formatISO(new Date());
        const obs = (document.getElementById('pickup-obs')?.value || '').trim();

        // Subtrai 1 exemplar físico disponível
        livro.qtdDisponivel -= 1;

        const ano = new Date().getFullYear();
        const seq = String(state.emprestimos.length + 1).padStart(4, '0');
        const numeroFicha = `RET-${ano}-${seq}`;
        const dataDevolucao = addDays(dataPegar, 14);

        state.emprestimos.unshift({
          id: `emp-${Date.now()}`,
          numeroFicha,
          livroId,
          leitorId: state.session.leitorId,
          dataEmprestimo: dataPegar,
          dataDevolucaoPrevista: dataDevolucao,
          dataDevolucaoEfetiva: null,
          status: 'Ativo',
          observacoes: obs ? `Retirada agendada: ${obs}` : 'Exemplar reservado para retirada física no balcão.'
        });

        saveState();
        AppActions.closeModal();

        // Abre comprovante de retirada
        AppActions.openVoucherModal({
          livro,
          dataPegar,
          dataDevolucao,
          numeroFicha,
          leitorNome: state.session.leitorNome,
          matricula: state.session.matricula
        });

        toast('Livro Físico Separado!', `Data para pegar no balcão: ${formatDateBR(dataPegar)}.`, 'success');
        renderApp();
      },

                        return `
                          <tr>
                            <td class="py-2 px-3 font-mono font-bold">${e.numeroFicha}</td>
                            <td class="py-2 px-3 font-semibold">${escapeHtml(l?.titulo || 'Livro')}</td>
                            <td class="py-2 px-3 font-mono">${formatDateBR(e.dataEmprestimo)}</td>
                            <td class="py-2 px-3 font-mono">${formatDateBR(e.dataDevolucaoPrevista)}</td>
                            <td class="py-2 px-3 font-mono">${formatDateBR(e.dataDevolucaoEfetiva)}</td>
                            <td class="py-2 px-3 font-bold ${e.status === 'Devolvido' ? 'text-emerald-700' : 'text-blue-700'}">${e.status}</td>
                          </tr>
                        `;
                      }).join('')}
                    </tbody>
                  </table>
                </div>
              </div>

              <div class="flex justify-between items-center px-6 py-3 border-t border-slate-100 bg-slate-50 shrink-0 no-print">
                <button type="button" onclick="window.print()" class="px-3 py-1.5 border border-slate-300 text-slate-700 rounded-lg text-xs font-semibold">Imprimir</button>
                <button type="button" onclick="AppActions.closeModal()" class="px-4 py-1.5 bg-slate-900 text-white rounded-lg text-xs font-semibold">Fechar</button>
              </div>
            </div>
          </div>
        `;
        document.body.insertAdjacentHTML('beforeend', modalHtml);
      },

      closeModal() {
        const m = document.getElementById('modal-container');
        if (m) m.remove();
      },

      exportBackupJson() {
        const backup = {
          sistema: 'BiblioFicha',
          versao: '4.0-standalone',
          dataExportacao: new Date().toISOString(),
          livros: state.livros,
          leitores: state.leitores,
          emprestimos: state.emprestimos,
          avaliacoes: state.avaliacoes
        };
        const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `backup_biblioficha_${formatISO(new Date())}.json`;
        a.click();
        URL.revokeObjectURL(url);
        toast('Backup Exportado', 'Arquivo JSON baixado com sucesso.', 'success');
      },

      resetMock() {
        resetMockData(true);
      }
    };

    // Inicialização ao carregar a página
    document.addEventListener('DOMContentLoaded', () => {
      loadState();
      renderApp();
    });

  })();
  </script>
</body>
</html>
